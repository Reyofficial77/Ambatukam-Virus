name: Build Android APK/AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev python3-pip

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer cython

      - name: Build Android package
        run: |
          set -o pipefail
          cp app.py main.py
          buildozer -v android debug 2>&1 | tee build.log

      - name: Prepare build error summary
        if: failure()
        run: python3 -c "import re; lines=open('build.log',errors='replace').read().splitlines(); idx=next((i for i,l in enumerate(lines) if re.search(r'error|Error|Traceback|Exception|FAIL',l)),None); idx = len(lines)-120 if idx is None else idx; start=max(0,idx-60); end=min(len(lines),idx+220); open('build-error-summary.txt','w').write(chr(10).join(lines[start:end]))"

      - name: Create GitHub issue with build error summary
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue create --title "Android build failure $(date -u +%Y-%m-%dT%H:%M:%SZ)" --body-file build-error-summary.txt || true

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: warn
